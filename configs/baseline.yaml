# Entity-resolution experiment configuration. The ER CLI will consume these settings.
seed: 42

data:
  root: 6ab10eb3b23ba_student_resource/student_resource/dataset
  train_dir: train
  test_dir: test
  train_source1: train_source1.tsv
  train_source2: train_source2.tsv
  train_source3: train_source3.tsv
  ground_truth: train_ground_truth.tsv
  test_source1: test_source1.tsv
  test_source2: test_source2.tsv
  test_source3: test_source3.tsv
  delimiter: "\t"

validation:
  strategy: source1_holdout
  test_size: 0.2
  random_state: 42
  metric: macro_f0.5

blocking:
  # Planned settings; tune candidate recall and pair volume on validation.
  name_top_k: 20
  address_top_k: 20
  use_exact_keys: true
  use_character_tfidf: true
  enforce_country_match: false

model:
  type: pairwise_classifier
  # Candidate-level threshold selection will be optimized against per-entity macro F0.5.
  threshold_source2: null
  threshold_source3: null

outputs:
  directory: outputs
  matching: matching_results.tsv
  candidates: candidate_pairs.tsv
